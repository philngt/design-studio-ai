services:
  studio:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${APP_URL:-http://localhost:8787}
        CODING_AGENT_PACKAGES: ${CODING_AGENT_PACKAGES:-}
    ports: ["8787:8787"]
    environment:
      APP_URL: ${APP_URL:-http://localhost:8787}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a stable ENCRYPTION_KEY}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      STUDIO_AGENTS_ENABLED: ${STUDIO_AGENTS_ENABLED:-false}
      STUDIO_AGENT_OWNER_ID: ${STUDIO_AGENT_OWNER_ID:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin}
      COMMUNITY_ENABLED: ${COMMUNITY_ENABLED:-false}
      COMMUNITY_ADMIN_IDS: ${COMMUNITY_ADMIN_IDS:-}
      COMMUNITY_ADMIN_EMAILS: ${COMMUNITY_ADMIN_EMAILS:-}
      OBSERVABILITY_ADMIN_IDS: ${OBSERVABILITY_ADMIN_IDS:-}
      POSTHOG_PROJECT_KEY: ${POSTHOG_PROJECT_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
    volumes: ["studio-data:/data", "studio-agent-home:/home/node"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  studio-data:
  studio-agent-home:
